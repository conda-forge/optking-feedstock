{% set name = "optking" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/psi-rking/optking/archive/{{ version }}.tar.gz
  sha256: 92cd81b5824d5570c054dc007a1f6e346f26546735e64fc5e814316ba31e62e9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools

  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - qcelemental >=0.30.0,<0.70.0
    - qcengine >=0.34.0
    - msgpack-python >=1.0
    - pydantic >=1.10.17,<3

test:
  imports:
    - optking
  commands:
    - test -f $SP_DIR/optking/__init__.py
    #- pip check
    # - pip check
    - sed -i "s;from .utils;#;g" optking/tests/test_opthelper.py
    - sed -i "s;schver = 2;schver = 1 #;g" optking/tests/test_opthelper.py
    - pytest -k test_lj_external_gradient optking/
    #- pytest --pyargs optking -k "lj_external_gradient"
    - python -c "import optking as qc;assert qc.__version__ == '{{ version }}', f'{qc.__version__=} differs from recipe=\'{{ version }}\''"
    - pip check
  source_files:
    - optking/tests/test_opthelper.py
  requires:
    - python {{ python_min }}
    - pip
    - pytest


about:
  home: https://github.com/psi-rking/optking
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A molecular optimizer for Quantum Chemistry calculations.
  dev_url: https://github.com/psi-rking/optking.git
  doc_url: https://optking.readthedocs.io/en/latest/
  doc_source_url: https://github.com/psi-rking/optking/blob/master/docs/source/index.rst

extra:
  recipe-maintainers:
    - AlexHeide
